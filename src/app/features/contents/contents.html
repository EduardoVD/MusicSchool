<section class="vitrine" aria-labelledby="titulo-vitrine">
    <div class="vitrine-cabecalho">
      <div>
        <h2 id="titulo-vitrine">INSTRUMENTOS EM DESTAQUE</h2>
      </div>
    </div>

    <div class="trilho">
      @for (conteudo of contents(); track conteudo.id) {
      <article class="card-conteudo">
        <div class="capa azul">
          <span>🎵</span>
          <small>MusicSchool</small>
        </div>
        <div class="card-corpo">
          <span class="categoria">{{ conteudo.type }}</span>
          <h3>{{ conteudo.name }}</h3>
          <a [routerLink]="['/conteudos', conteudo.id]" [attr.aria-label]="'Conhecer ' + conteudo.name">Conhecer
            <span>→</span></a>
        </div>
      </article>
      }
    </div>
  </section>
